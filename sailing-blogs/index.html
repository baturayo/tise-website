    <!-- The page is rendered into #root at build time, for search engines and link previews. Hide it

    <style>.js-pending #root{visibility:hidden;animation:tise-show 0s 3s forwards}@keyframes tise-show{to{visibility:visible}}</style>

  <body class="blog">
    <div id="root"></div>
    <script type="module" src="/src/blog/index/main.tsx"></script>
